services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: symphony_test_1
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${SYMPHONY_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrations:
    build:
      context: .
      dockerfile: Dockerfile.Migrations
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=symphony_test_1;Username=postgres;Password=postgres"
    depends_on:
      postgres:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "${SYMPHONY_KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./src/symphony-test-1.AppHost/Realms:/opt/keycloak/data/import:ro
      - ./src/symphony-test-1.AppHost/Themes:/opt/keycloak/themes:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /realms/symphony HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q '200'"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s

  api:
    build:
      context: .
      dockerfile: Dockerfile.Api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=symphony_test_1;Username=postgres;Password=postgres"
      Authentication__Authority: "http://localhost:${SYMPHONY_KEYCLOAK_PORT:-8180}/realms/symphony"
      Authentication__MetadataAddress: "http://keycloak:8080/realms/symphony/.well-known/openid-configuration"
      Authentication__Audience: "symphony-api"
      Authentication__RequireHttpsMetadata: "false"
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${SYMPHONY_API_PORT:-8081}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Gateway__ApiBaseUrl: "http://api:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
