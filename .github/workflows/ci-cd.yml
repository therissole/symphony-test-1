name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Validate OpenFGA authorization model
      shell: pwsh
      run: ./tools/test-openfga-model.ps1

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: '10.0.302'

    - name: Restore locked dependencies
      run: dotnet restore symphony-test-1.slnx --locked-mode

    - name: Build
      run: dotnet build symphony-test-1.slnx --no-restore --configuration Release

    - name: Lint generated OpenAPI contract
      shell: pwsh
      run: >-
        ./tools/lint-openapi.ps1
        src/symphony-test-1.Api/obj/openapi/symphony-test-1.json

    - name: Verify Roslyn code style
      run: dotnet format symphony-test-1.slnx style --verify-no-changes --no-restore

    - name: Audit vulnerable packages
      run: dotnet list symphony-test-1.slnx package --vulnerable --include-transitive --no-restore

    - name: Run Unit Tests
      run: dotnet test tests/unit/symphony-test-1.UnitTests/symphony-test-1.UnitTests.csproj --no-build --no-restore --configuration Release --verbosity normal --logger "trx;LogFileName=unit-test-results.trx"

    - name: Run UI Component Tests
      run: dotnet test tests/ui/symphony-test-1.WebTests/symphony-test-1.WebTests.csproj --no-build --no-restore --configuration Release --verbosity normal --logger "trx;LogFileName=ui-test-results.trx"

    - name: Run Integration Tests
      run: dotnet test tests/integration/symphony-test-1.IntegrationTests/symphony-test-1.IntegrationTests.csproj --no-build --no-restore --configuration Release --verbosity normal --logger "trx;LogFileName=integration-test-results.trx"

    - name: Install Playwright Chromium
      run: pwsh tests/e2e/symphony-test-1.E2ETests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

    - name: Run E2E Tests
      run: dotnet test tests/e2e/symphony-test-1.E2ETests/symphony-test-1.E2ETests.csproj --no-build --no-restore --configuration Release --verbosity normal --logger "trx;LogFileName=e2e-test-results.trx"

    - name: Run black-box acceptance tests
      run: pwsh tests/acceptance/run.ps1

    - name: Publish test results
      uses: EnricoMi/publish-unit-test-result-action@b3f8796819acf652cecbf27a64fa9ac8d7e137ee # v2
      if: always()
      with:
        files: |
          **/TestResults/*.trx

  aspire-smoke-test:
    runs-on: ubuntu-latest
    needs: build-and-test

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: '10.0.302'

    - name: Install Aspire CLI
      run: |
        curl -sSL https://aspire.dev/install.sh | bash -s -- --version 13.4.6
        echo "$HOME/.aspire/bin" >> "$GITHUB_PATH"

    - name: Restore locked dependencies
      run: dotnet restore symphony-test-1.slnx --locked-mode

    - name: Start Aspire application
      run: |
        aspire start --apphost src/symphony-test-1.AppHost/symphony-test-1.AppHost.csproj --isolated --non-interactive
        aspire wait gateway --status healthy --timeout 420 --apphost src/symphony-test-1.AppHost/symphony-test-1.AppHost.csproj --non-interactive || {
          aspire describe --apphost src/symphony-test-1.AppHost/symphony-test-1.AppHost.csproj --format Json --non-interactive
          exit 1
        }

    - name: Verify application boundary
      shell: bash
      run: |
        gateway_description="$(aspire describe gateway --apphost src/symphony-test-1.AppHost/symphony-test-1.AppHost.csproj --format Json --non-interactive)"

        gateway_url="$(jq -r '.resources[0].urls[] | select(.name == "https") | .url' <<< "$gateway_description")"
        echo "Gateway URL: $gateway_url"

        test -n "$gateway_url"

        root_status="$(curl --insecure --output /dev/null --silent --write-out '%{http_code}' "$gateway_url/")"
        health_status="$(curl --insecure --output /dev/null --silent --write-out '%{http_code}' "$gateway_url/health")"
        echo "Root status: $root_status"
        echo "Health status: $health_status"
        test "$root_status" -ge 200 -a "$root_status" -lt 400
        test "$health_status" = "200"

    - name: Stop Aspire application
      if: always()
      run: aspire stop --all --non-interactive

  codeql:
    name: CodeQL security analysis
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: '10.0.302'

    - name: Initialize CodeQL
      uses: github/codeql-action/init@adfda868f108ac4222129de456ea554034a27db7 # v4
      with:
        languages: csharp
        queries: security-extended

    - name: Restore locked dependencies
      run: dotnet restore symphony-test-1.slnx --locked-mode

    - name: Build for CodeQL
      run: dotnet build symphony-test-1.slnx --configuration Release --no-restore

    - name: Analyze
      uses: github/codeql-action/analyze@adfda868f108ac4222129de456ea554034a27db7 # v4

