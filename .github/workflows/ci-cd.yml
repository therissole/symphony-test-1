name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      checks: write
      pull-requests: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Verify formatting
      run: dotnet format symphony-test-1.slnx --verify-no-changes --no-restore

    - name: Audit vulnerable packages
      run: dotnet list symphony-test-1.slnx package --vulnerable --include-transitive --no-restore
    
    - name: Run Unit Tests
      run: dotnet test tests/unit/symphony-test-1.UnitTests/symphony-test-1.UnitTests.csproj --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=unit-test-results.trx"

    - name: Run UI Component Tests
      run: dotnet test tests/ui/symphony-test-1.WebTests/symphony-test-1.WebTests.csproj --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=ui-test-results.trx"
    
    - name: Run Integration Tests
      run: dotnet test tests/integration/symphony-test-1.IntegrationTests/symphony-test-1.IntegrationTests.csproj --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=integration-test-results.trx"

    - name: Install Playwright Chromium
      run: pwsh tests/e2e/symphony-test-1.E2ETests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
    
    - name: Run E2E Tests
      run: dotnet test tests/e2e/symphony-test-1.E2ETests/symphony-test-1.E2ETests.csproj --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=e2e-test-results.trx"

    - name: Run black-box acceptance tests
      run: pwsh tests/acceptance/run.ps1
    
    - name: Publish test results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: |
          **/TestResults/*.trx

  aspire-smoke-test:
    runs-on: ubuntu-latest
    needs: build-and-test
    
    permissions:
      contents: read
    
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Install Aspire CLI
      run: |
        curl -sSL https://aspire.dev/install.sh | bash
        echo "$HOME/.aspire/bin" >> "$GITHUB_PATH"

    - name: Start Aspire application
      run: |
        aspire start --apphost src/symphony-test-1.AppHost/symphony-test-1.AppHost.csproj --isolated --non-interactive
        aspire wait gateway --status healthy --timeout 420 --apphost src/symphony-test-1.AppHost/symphony-test-1.AppHost.csproj --non-interactive || {
          aspire describe --apphost src/symphony-test-1.AppHost/symphony-test-1.AppHost.csproj --format Json --non-interactive
          exit 1
        }

    - name: Verify application boundary
      shell: bash
      run: |
        gateway_description="$(aspire describe gateway --apphost src/symphony-test-1.AppHost/symphony-test-1.AppHost.csproj --format Json --non-interactive)"

        gateway_url="$(jq -r '.resources[0].urls[] | select(.name == "https") | .url' <<< "$gateway_description")"
        echo "Gateway URL: $gateway_url"

        test -n "$gateway_url"

        root_status="$(curl --insecure --output /dev/null --silent --write-out '%{http_code}' "$gateway_url/")"
        health_status="$(curl --insecure --output /dev/null --silent --write-out '%{http_code}' "$gateway_url/api/health")"
        echo "Root status: $root_status"
        echo "Health status: $health_status"
        test "$root_status" -ge 200 -a "$root_status" -lt 400
        test "$health_status" = "200"

        for endpoint in /api/languages /api/greetings /api/greetings/by-language/en; do
          status="$(curl --insecure --output /dev/null --silent --write-out '%{http_code}' "$gateway_url$endpoint")"
          echo "$endpoint status: $status"
          test "$status" = "401"
        done

    - name: Stop Aspire application
      if: always()
      run: aspire stop --all --non-interactive

