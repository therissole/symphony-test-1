name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      checks: write
      pull-requests: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Verify formatting
      run: dotnet format symphony-test-1.slnx --verify-no-changes --no-restore

    - name: Audit vulnerable packages
      run: dotnet list symphony-test-1.slnx package --vulnerable --include-transitive --no-restore
    
    - name: Run Unit Tests
      run: dotnet test tests/unit/symphony-test-1.UnitTests/symphony-test-1.UnitTests.csproj --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=unit-test-results.trx"

    - name: Run UI Component Tests
      run: dotnet test tests/ui/symphony-test-1.WebTests/symphony-test-1.WebTests.csproj --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=ui-test-results.trx"
    
    - name: Run Integration Tests
      run: dotnet test tests/integration/symphony-test-1.IntegrationTests/symphony-test-1.IntegrationTests.csproj --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=integration-test-results.trx"

    - name: Install Playwright Chromium
      run: pwsh tests/e2e/symphony-test-1.E2ETests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
    
    - name: Run E2E Tests
      run: dotnet test tests/e2e/symphony-test-1.E2ETests/symphony-test-1.E2ETests.csproj --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=e2e-test-results.trx"
    
    - name: Publish test results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: |
          **/TestResults/*.trx

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    
    permissions:
      contents: read
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      run: docker build -t symphony-test-1-api:latest .
    
    - name: Start services
      run: docker compose up --build --wait
    
    - name: Check API health
      run: |
        for i in {1..10}; do
          if curl -f http://localhost:8080/api/health; then
            echo "API is healthy"
            exit 0
          fi
          echo "Waiting for API... attempt $i"
          sleep 5
        done
        echo "API health check failed"
        docker compose logs
        exit 1
    
    - name: Test API endpoints
      run: |
        # Test the hosted Blazor WebAssembly application
        curl -f http://localhost:8080/ || exit 1

        # Test languages endpoint
        curl -f http://localhost:8080/api/languages || exit 1
        
        # Test greetings endpoint
        curl -f http://localhost:8080/api/greetings || exit 1
        
        # Test greeting by language
        curl -f "http://localhost:8080/api/greetings/by-language/en" || exit 1
    
    - name: Stop services
      if: always()
      run: docker compose down -v

